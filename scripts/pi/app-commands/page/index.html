<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pi commands</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --mute: #6b6b66; --card: #fff; --line: #d9d9d4;
          --warn: #a3361f; --ok: #2c6b3f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ececea; --mute: #a2a29c; --card: #222220;
          --line: #3a3a37; --warn: #ff8a6e; --ok: #7fcf95; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.45 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 30rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  h2 { font-size: 1.05rem; margin: 2rem 0 .5rem; }
  p { margin: .25rem 0 .75rem; color: var(--mute); }
  button { display: block; width: 100%; min-height: 3.25rem; margin: .5rem 0; padding: .75rem 1rem; font: inherit;
           text-align: left; color: var(--fg); background: var(--card); border: 1px solid var(--line);
           border-radius: .75rem; cursor: pointer; }
  button.danger { border-color: var(--warn); }
  button:disabled { opacity: .5; }
  #status { min-height: 3rem; margin: 1rem 0; padding: .75rem 1rem; border-radius: .75rem; background: var(--card);
            border: 1px solid var(--line); white-space: pre-wrap; overflow-wrap: anywhere; }
  #status.bad { border-color: var(--warn); }
  #status.good { border-color: var(--ok); }
  #confirm { display: none; }
  input, textarea { width: 100%; font: inherit; padding: .6rem .75rem; color: var(--fg); background: var(--card);
                    border: 1px solid var(--line); border-radius: .5rem; }
  textarea { min-height: 7rem; font-family: ui-monospace, monospace; font-size: .8rem; }
  details { margin-top: 2rem; }
  summary { cursor: pointer; color: var(--mute); }
</style>
</head>
<body>
<main>
  <h1>Pi commands</h1>
  <p>For when the app can't: sign with a spare key (Proton Pass or the YubiKey). Each command asks twice.</p>

  <div id="actions">
    <button data-action="probe">Check the wiring (does nothing)</button>
    <button data-action="defib-fire" class="danger">Restart TrueNAS (defib)</button>
    <button data-action="kill-arm">Arm the kill switch</button>
    <button data-action="kill-off">Disarm the kill switch</button>
    <button data-action="kill-on" class="danger">Lock the Pi now</button>
  </div>

  <div id="confirm">
    <h2 id="confirm-q"></h2>
    <button id="yes" class="danger">Yes, do it</button>
    <button id="no">No, cancel</button>
  </div>

  <div id="status" role="status" aria-live="polite">Pick a command.</div>

  <details>
    <summary>Add a spare key</summary>
    <p>Makes a new passkey for this page and shows the line to pin on the Pi. Pinning is done by hand; until then
      the key can't do anything.</p>
    <label for="kname">Name (lowercase, like proton-pass or yubikey)</label>
    <input id="kname" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button id="enroll">Make the key</button>
    <textarea id="line" readonly></textarea>
  </details>
</main>
<script src="/app.js"></script>
</body>
</html>
